hostname SW2
vlan 20
 name ENGINEERING
vlan 999
 name NATIVE_UNUSED
interface GigabitEthernet0/0
 description Trunk-to-R1-Gi0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,999
 no shutdown
interface range GigabitEthernet0/1-20
 description VLAN20-engineering-access
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
end
