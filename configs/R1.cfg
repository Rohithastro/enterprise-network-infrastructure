hostname R1
no ip domain-lookup
!
interface GigabitEthernet0/0
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/2
 no ip address
 no shutdown
!
interface GigabitEthernet0/2.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
!
interface GigabitEthernet0/3
 no ip address
 no shutdown
!
interface GigabitEthernet0/3.40
 encapsulation dot1Q 40
 ip address 10.10.40.1 255.255.255.0
 ip access-group GUEST-IN in
!
interface GigabitEthernet0/4
 description OSPF-to-R2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/5
 description OSPF-to-R3
 ip address 10.0.13.1 255.255.255.252
 no shutdown
!
ip dhcp excluded-address 10.10.10.1 10.10.10.49
ip dhcp excluded-address 10.10.10.201 10.10.10.254
ip dhcp excluded-address 10.10.20.1 10.10.20.49
ip dhcp excluded-address 10.10.20.201 10.10.20.254
ip dhcp excluded-address 10.10.30.1 10.10.30.49
ip dhcp excluded-address 10.10.30.201 10.10.30.254
ip dhcp excluded-address 10.10.40.1 10.10.40.49
ip dhcp excluded-address 10.10.40.201 10.10.40.254
ip dhcp pool VLAN10-USERS
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 1.1.1.1
!
ip dhcp pool VLAN20-ENGINEERING
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 1.1.1.1
!
ip dhcp pool VLAN30-OPERATIONS
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 1.1.1.1
!
ip dhcp pool VLAN40-GUEST
 network 10.10.40.0 255.255.255.0
 default-router 10.10.40.1
 dns-server 1.1.1.1
!
ip access-list extended GUEST-IN
 remark Block guest access to private corporate and transit networks
 deny ip 10.10.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.10.40.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.10.40.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.10.40.0 0.0.0.255 any
!
router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/4
 no passive-interface GigabitEthernet0/5
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
end
